name: Validar Forms APEX Again

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  estructura:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compilar scripts y pruebas
        run: python -m compileall -q evals tests
      - name: Validar skill, referencias, manifiestos y corpus
        run: python evals/validate.py --json
      - name: Ejecutar regresiones estructurales
        run: python -m unittest discover -s tests -p 'test_*.py' -v
